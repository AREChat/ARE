<html lang="ja">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <title>新規登録｜ARE チャット｜やりすぎヒーロー伝説＆ドリームストーリー</title>
  <meta name="description" content="無料チャット「ARE」の新規登録ページです。本名や住所は不要で、ニックネームとパスワードだけで始められます。">
  <link rel="canonical" href="https://arechat.github.io/AREDA/register.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="やりすぎヒーロー伝説＆ドリームストーリー">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="新規登録｜ARE チャット｜やりすぎヒーロー伝説＆ドリームストーリー">
  <meta property="og:description" content="無料チャット「ARE」の新規登録ページです。本名や住所は不要で、ニックネームとパスワードだけで始められます。">
  <meta property="og:url" content="https://arechat.github.io/AREDA/register.html">
  <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="register.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="apikey.js"></script>
    <script src="system.js"></script>
    <script src="register.js" defer></script>
</head>
<body>
    <div class="background-glow" aria-hidden="true"></div>
    <main class="app">
        <header class="brand">
            <div class="brand-logo" aria-hidden="true">A</div>
            <div>
                <h1>ARE</h1>
                <p>REALTIME CHAT</p>
            </div>
        </header>

        <section class="panel" aria-labelledby="pageTitle">
            <h2 id="pageTitle">アカウントを作成</h2>
            <p class="muted">表示名・ログインID・パスワードだけで登録できます。電話番号やメールアドレスは必要ありません。</p>

            <form id="registerForm">
                <label for="displayName">表示名</label>
                <input id="displayName" name="displayName" autocomplete="nickname" maxlength="50" required>

                <label for="loginId">ログインID</label>
                <input id="loginId" name="loginId" autocomplete="username" maxlength="80" required>

                <label for="password">パスワード</label>
                <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
                <p class="field-help">8文字以上で入力してください。</p>

                <label for="confirmPassword">パスワード（確認）</label>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>

                <button id="registerButton" class="primary-button" type="submit">アカウントを作成</button>
            </form>

            <p id="registerStatus" class="status-message" role="status" aria-live="polite"></p>

            <section id="recoveryCodePanel" class="recovery-panel" hidden aria-labelledby="recoveryCodeTitle">
                <h3 id="recoveryCodeTitle">復旧コードを保存してください</h3>
                <p>このコードはアカウント復旧に必要です。安全な場所に保存してください。画面を閉じると再表示できない場合があります。</p>
                <div class="recovery-code-row">
                    <code id="recoveryCode"></code>
                    <button id="copyRecoveryCode" class="button-secondary" type="button">コピー</button>
                </div>
                <p id="copyStatus" class="field-help" role="status" aria-live="polite"></p>
                <button id="continueButton" class="primary-button" type="button">ログイン画面へ</button>
            </section>

            <div class="button-row">
                <button id="backToLogin" class="button-secondary" type="button">ログイン画面に戻る</button>
            </div>
        </section>
        <footer>ARE · CONNECT WITH EVERYONE</footer>
        </main>
<script src="./password-toggle.js"></script>
<script src="./protect.js"></script>
<script src="shared/are-pad.js"></script>
<script src="shared/are-offline.js" defer></script>
</body>
</html>
