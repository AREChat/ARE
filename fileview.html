<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; font-src 'self' data:; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; manifest-src 'self'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b1020">
<link rel="icon" type="image/png" href="./icon-192.png">
<title>ファイルを開く | ARE</title>
<script src="./protect.js"></script>
<style>
:root{--bg:#0b1020;--panel:#151b30;--text:#e8ecf6;--sub:#9aa5c4;--line:#2a3354;--accent:#6ea8ff}
@media (prefers-color-scheme:light){:root{--bg:#f5f6fa;--panel:#fff;--text:#1b2033;--sub:#5b6585;--line:#d8dce8;--accent:#2457d6}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.7 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.title{font-weight:700;word-break:break-all;flex:1 1 200px;min-width:0}
.meta{color:var(--sub);font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;font-size:14px;padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
button:hover{border-color:var(--accent)}
button.main{background:var(--accent);border-color:var(--accent);color:#fff}
main{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;align-items:center}
pre{margin:0;width:100%;max-width:980px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;font:14px/1.75 ui-monospace,SFMono-Regular,Menlo,Consolas,"Yu Gothic UI",monospace;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
img.view{max-width:100%;max-height:calc(100vh - 110px);object-fit:contain;cursor:zoom-in;-webkit-user-drag:none;user-select:none}
img.view.zoom{max-width:none;max-height:none;cursor:zoom-out}
video,audio{max-width:100%;max-height:calc(100vh - 110px)}
audio{width:min(560px,100%);margin-top:40px}
.pdf{width:100%;max-width:980px;display:flex;flex-direction:column;gap:12px}
.pg{width:100%;background:#fff;border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#6b7390;font-size:13px;overflow:hidden}
.pg:empty::before{content:attr(data-n) " ページ目…"}
.pg canvas{display:block;width:100%;height:100%;-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
.note{max-width:560px;margin:40px auto;text-align:center;color:var(--sub)}
.note b{color:var(--text)}
</style>
</head>
<body>
<header class="bar">
    <div class="title" id="fvName">ファイルを開いています…</div>
    <div class="meta" id="fvMeta"></div>
    <div class="btns">
        <button type="button" id="fvCopy" hidden>📋 コピー</button>
        <button type="button" id="fvSave" class="main" hidden>⬇ ダウンロード</button>
        <button type="button" id="fvClose">閉じる</button>
    </div>
</header>
<main id="fvMain"><div class="note">読み込み中…</div></main>
<script src="./apikey.js"></script>
<script src="./textenc.js"></script>
<script src="./fileview.js"></script>
</body>
</html>
