<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; font-src 'self' data:; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'self'; manifest-src 'self'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b1020">
<link rel="icon" type="image/png" href="./icon-192.png">
<title>ファイルを開く | ARE</title>
<script src="./protect.js"></script>
<style>
:root{--bg:#0b1020;--panel:#151b30;--text:#e8ecf6;--sub:#9aa5c4;--line:#2a3354;--accent:#6ea8ff}
@media (prefers-color-scheme:light){:root{--bg:#f5f6fa;--panel:#fff;--text:#1b2033;--sub:#5b6585;--line:#d8dce8;--accent:#2457d6}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.7 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.title{font-weight:700;word-break:break-all;flex:1 1 200px;min-width:0}
.meta{color:var(--sub);font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;font-size:14px;padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
button:hover{border-color:var(--accent)}
button.main{background:var(--accent);border-color:var(--accent);color:#fff}
main{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;align-items:center}
pre{margin:0;width:100%;max-width:980px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;font:14px/1.75 ui-monospace,SFMono-Regular,Menlo,Consolas,"Yu Gothic UI",monospace;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
img.view{max-width:100%;max-height:calc(100vh - 110px);object-fit:contain;cursor:zoom-in;-webkit-user-drag:none;user-select:none}
img.view.zoom{max-width:none;max-height:none;cursor:zoom-out}
video,audio{max-width:100%;max-height:calc(100vh - 110px)}
audio{width:min(560px,100%);margin-top:40px}
.pdf{width:100%;max-width:980px;display:flex;flex-direction:column;gap:12px}
.pg{width:100%;background:#fff;border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#6b7390;font-size:13px;overflow:hidden}
.pg:empty::before{content:attr(data-n) " ページ目…"}
.pg canvas{display:block;width:100%;height:100%;-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
.hf{display:block;width:100%;max-width:1200px;flex:1 1 auto;min-height:calc(100vh - 150px);border:1px solid var(--line);border-radius:6px;background:#fff}
.hnote{width:100%;max-width:1200px;margin:0 0 8px;font-size:12.5px;color:var(--sub)}
.note{max-width:560px;margin:40px auto;text-align:center;color:var(--sub)}
.note b{color:var(--text)}
/* pptx（スライド）：一覧とスライドショー。動きや点滅は付けない */
.pp-list{width:100%;max-width:980px;display:flex;flex-direction:column;gap:14px}
.pp-item{width:100%}
.pp-frame{position:relative;width:100%;background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;color:#6b7390;font-size:13px;display:flex;align-items:center;justify-content:center}
.pp-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;font-size:13px;color:var(--sub)}
.pp-go{font-size:12.5px;padding:3px 10px;border-radius:8px}
.pp-notes{margin-top:2px;padding:6px 10px;border:1px dashed var(--line);border-radius:8px;font-size:12.5px;color:var(--sub);white-space:pre-wrap;word-break:break-word}
.pp-stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;color:#000;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;-webkit-user-select:none;user-select:none}
.pp-stage *{box-sizing:border-box}
.pp-s{position:absolute}
.pp-s img{display:block;-webkit-user-drag:none;pointer-events:none}
.pp-ph{display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;color:#888;border:1px dashed #bbb;background:rgba(128,128,128,.08)}
.pp-t{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;flex-direction:column;overflow:visible;word-break:break-word;overflow-wrap:anywhere}
.pp-p{margin:0;white-space:pre-wrap}
.pp-tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.pp-tbl td{border:1px solid rgba(128,128,128,.55);vertical-align:top;padding:0;overflow:hidden}
.pp-tbl .pp-t{position:static;height:auto}
body.pp-open{overflow:hidden}
.pp-show{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;z-index:50;background:#000;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
.pp-showframe{position:relative;flex:1;min-height:0;cursor:pointer;overflow:hidden}
.pp-hud{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.7))}
.pp-show.pp-idle .pp-hud{opacity:0;pointer-events:none}
.pp-show.pp-idle{cursor:none}
.pp-b{font-size:14px;padding:8px 16px;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35)}
.pp-b:disabled{opacity:.35}
.pp-count{color:#fff;font-size:14px;min-width:64px;text-align:center}
.pp-shownote{position:absolute;left:12px;right:12px;bottom:70px;max-height:30%;overflow:auto;padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.75);color:#fff;font-size:15px;white-space:pre-wrap}
@media print{.pp-show{display:none}}
</style>
</head>
<body>
<header class="bar">
    <div class="title" id="fvName">ファイルを開いています…</div>
    <div class="meta" id="fvMeta"></div>
    <div class="btns">
        <button type="button" id="fvShow" class="main" hidden>▶ スライドショー</button>
        <button type="button" id="fvShowHere" hidden>▶ いまのスライドから</button>
        <button type="button" id="fvRun" hidden>🛡 プログラムを止める</button>
        <button type="button" id="fvNet" hidden>🌐 外の画像も読む</button>
        <button type="button" id="fvCopy" hidden>📋 コピー</button>
        <button type="button" id="fvSave" class="main" hidden>⬇ ダウンロード</button>
        <button type="button" id="fvClose">閉じる</button>
    </div>
</header>
<main id="fvMain"><div class="note">読み込み中…</div></main>
<script src="./apikey.js"></script>
<script src="./textenc.js"></script>
<script src="./fileview.js"></script>
</body>
</html>
